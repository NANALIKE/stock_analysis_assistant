[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data-worker"
version = "0.1.0"
description = "Versioned batch data protocol for Stock Analysis Assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stock-worker = "stock_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["stock_worker*"]

[tool.setuptools.package-data]
stock_worker = ["dependencies.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
